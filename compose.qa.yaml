services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    networks: [qa]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${QA_SQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

  init:
    build:
      context: .
      dockerfile: qa/infra/Dockerfile.init
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        for attempt in $$(seq 1 30); do
          if /opt/mssql-tools18/bin/sqlcmd -S tcp:sql,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q 'SELECT 1' >/dev/null 2>&1; then
            echo "SQL Server accesible desde init (intento $$attempt)."
            break
          fi
          if [ "$$attempt" -eq 30 ]; then
            /opt/mssql-tools18/bin/sqlcmd -S tcp:sql,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q 'SELECT 1'
            exit 1
          fi
          sleep 2
        done
        /opt/mssql-tools18/bin/sqlcmd -S tcp:sql,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -i /init/schema.sql
        /opt/mssql-tools18/bin/sqlcmd -S tcp:sql,1433 -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -i /init/seed.sql
    environment:
      MSSQL_SA_PASSWORD: ${QA_SQL_PASSWORD}
    depends_on:
      sql:
        condition: service_healthy
    networks: [qa]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.qa
    environment:
      PORT: "5000"
      MSSQL_JDBC_URL: jdbc:sqlserver://sql:1433;databaseName=DulceMielBD;encrypt=true;trustServerCertificate=true
      DB_USER: sa
      DB_PASSWORD: ${QA_SQL_PASSWORD}
      JWT_SECRET: ${QA_JWT_SECRET}
      FRONTEND_URL: ${QA_WEB_URL}
    networks: [qa]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.qa
      args:
        QA_API_URL: ${QA_API_URL}
    depends_on:
      - backend
    networks: [qa]

networks:
  qa:
    external: true
    name: ${QA_DOCKER_NETWORK:-jenkins_default}

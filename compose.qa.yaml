services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${QA_SQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

  init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      /opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -i /init/schema.sql &&
      /opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -i /init/seed.sql
    environment:
      MSSQL_SA_PASSWORD: ${QA_SQL_PASSWORD}
    volumes:
      - ./backend/database/schema.sql:/init/schema.sql:ro
      - ./qa/infra/seed.sql:/init/seed.sql:ro
    depends_on:
      sql:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.qa
    environment:
      PORT: "5000"
      MSSQL_JDBC_URL: jdbc:sqlserver://sql:1433;databaseName=DulceMielBD;encrypt=true;trustServerCertificate=true
      DB_USER: sa
      DB_PASSWORD: ${QA_SQL_PASSWORD}
      JWT_SECRET: ${QA_JWT_SECRET}
      FRONTEND_URL: ${QA_WEB_URL}
    ports:
      - "127.0.0.1:${QA_API_PORT}:5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.qa
    ports:
      - "127.0.0.1:${QA_WEB_PORT}:4200"
    depends_on:
      - backend
